name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The contributions calendar is baked in at build time, so rebuild daily to
  # keep it current without needing a commit.
  schedule:
    - cron: "0 5 * * *"
  # Lets you redeploy by hand from the Actions tab without pushing a commit.
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and don't cancel one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          # Empty for a user site (<user>.github.io). For a project repo, set
          # this to /<repo-name> so assets resolve under the subpath.
          BASE_PATH: ""

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
